<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Приключения Тимохи, Глава 3. Уровень 1, подглава 2</title>
	<style>
        body { margin: 0; padding: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { box-shadow: 0 0 20px black; border: 2px solid #444; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
	<script>
		class Level6 extends Phaser.Scene {
			constructor () { super('Level6'); }

			preload () {
				this.add.graphics().fillStyle(0xADD8E6, 1).fillRect(0, 0, 64, 32).generateTexture('platforms', 64, 32);
                this.add.graphics().fillStyle(0x00008B, 1).fillTriangle(0, 32, 32, 32, 16, 0).generateTexture('hazard', 32, 32);
                this.add.graphics().fillStyle(0x795548, 1).fillRect(0, 0, 32, 64).generateTexture('exit', 32, 64);
				this.add.graphics().fillStyle(0xffffff, 0.5).lineStyle(3, 0xffffff).fillCircle(40, 40, 35).strokeCircle(40, 40, 35).generateTexture('btnBg', 80, 80);

                let lollipopGfx = this.add.graphics();
                lollipopGfx.fillStyle(0x8B4513, 1); 
                lollipopGfx.fillRect(35, 30, 10, 50);
                lollipopGfx.fillStyle(0xFF69B4, 1);
                lollipopGfx.fillCircle(40, 30, 30);
                lollipopGfx.fillStyle(0xffffff, 0.6);
                lollipopGfx.fillCircle(40, 30, 15);
                lollipopGfx.fillStyle(0xFF69B4, 1);
                lollipopGfx.fillCircle(40, 30, 5);
                lollipopGfx.generateTexture('lollipop', 80, 80);
    
                
                let chocoGfx = this.add.graphics();
                chocoGfx.fillStyle(0x3E2723, 1); 
                chocoGfx.fillRect(0, 0, 64, 32);
                chocoGfx.fillStyle(0xFFFFFF, 1); 
                chocoGfx.fillRect(10, 10, 4, 4);
                chocoGfx.fillRect(50, 20, 4, 4);
                chocoGfx.fillStyle(0xFF0000, 1); 
                chocoGfx.fillRect(30, 5, 4, 4);
                chocoGfx.fillStyle(0x00FF00, 1); 
                chocoGfx.fillRect(15, 25, 4, 4);
                chocoGfx.generateTexture('platforms', 64, 32);
    
                
                let jellySpikeGfx = this.add.graphics();
                jellySpikeGfx.fillStyle(0xD4E157, 1); 
                jellySpikeGfx.fillTriangle(0, 32, 16, 0, 32, 32);
                jellySpikeGfx.fillStyle(0xF0F4C3, 0.7);
                jellySpikeGfx.fillTriangle(8, 24, 16, 8, 24, 24);
                jellySpikeGfx.generateTexture('hazard', 32, 32);

                 let bearGfx = this.add.graphics();
                 bearGfx.fillStyle(0xFF9800, 1); 
                 bearGfx.fillEllipse(16, 20, 22, 24);
                 bearGfx.fillRect(8, 0, 4, 6); 
                 bearGfx.fillRect(24, 0, 4, 6); 
                 
                 bearGfx.fillStyle(0x000000, 1);
                 bearGfx.fillCircle(11, 16, 2);
                 bearGfx.fillCircle(21, 16, 2);
                 bearGfx.generateTexture('bear', 32, 32);
                 this.add.graphics().fillStyle(0x9C27B0, 1).fillCircle(40, 40, 35).generateTexture('exit', 80, 80);
                this.add.graphics().fillStyle(0xffffff, 0.5).lineStyle(3, 0xffffff).fillCircle(40, 40, 35).strokeCircle(40, 40, 35).generateTexture('btnBg', 80, 80);

                this.load.image('timoha', 'https://capybaraabcnet.github.io/TimohaGame/photo.png');
                this.add.graphics().fillStyle(0xFFA500, 1).fillRect(0, 0, 10, 6).generateTexture('bullet', 10, 6);

		    }

		    create() {
		    	this.timoha = this.physics.add.sprite(100, 0, 'timoha').setScale(0.2);
		    	this.timoha.setCollideWorldBounds();

		    	const level = [
                    '111111111111111111111111111111111111111111111111111111111111111111111111111111',
                    '1............................................................................1',
                    '1.............L...............L..........................L.............L.....1',
                    '1...........11111............1111......................11111..........111....1',
                    '1............................................................................1',
                    '1............................................................................1',
                    '1....T.........1...2......1...........1....2.....1.........1....2..1.........1',
                    '1.............111111111111...........111111111111.........11111111......V.....1',
                    '1L..........................................................................L1',
                    '11111111111..................11111..................111..............111111111',
                    '1.................................1....................1........2............1',
                    '1..............1...2......1.......11..1..2.......1.....11..1.......1.........1',
                    '1.............1111111111111.........11111111111111.......11111111111.........1',
                    '1....................................X..............X....................X...1',
                    '1..........X.X..............X........X........X.....X...............X....X...1',
                    '1..X.......X.X......X.......X...X....X........X.....X....X.....X....X....X...1',
                    '1L.X..L....X.X..L...X...L...X...X.L..X...L....X.....X....X.....X....X....X..L1',
                    '1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX1',
                    '111111111111111111111111111111111111111111111111111111111111111111111111111111'
                ];

		    	this.tileSize = 32;
		    	this.lastFired = 0;
		    	this.shootPressed = false;
		    	this.allMobs = 0;

		    	this.platforms = this.physics.add.group({ allowGravity: false, immovable: true });
		    	this.hazard = this.physics.add.group({ allowGravity: false, immovable: true });
		    	this.lollipop = this.physics.add.group({ allowGravity: false, immovable: true });
		    	
		    	this.bear = this.physics.add.group({ allowGravity: true, immovable: false });
		    	this.exit = this.physics.add.group({ allowGravity: false, immovable: true});
		    	this.bullets = this.physics.add.group({ defaultKey: 'bullet', maxSize: 20 });

		    	level.forEach((row, indexRow) => {
		    		for (let i = 0; i < row.length; i++) {
		    			const symbol = row[i];
		    			const x = i * this.tileSize;
		    			const y = indexRow * this.tileSize;

		    			if (symbol === '1') {
		    				this.platforms.create(x, y, 'platforms').setOrigin(0, 0).refreshBody();
		    			} else if (symbol === 'T') {
		    				this.timoha.setPosition(x, y, 'timoha');
		    			} else if (symbol === 'X') {
		    				let h = this.hazard.create(x + 16, y + 32, 'hazard');
		    				h.body.setSize(32, 32);
		    			} else if (symbol === 'V') {
		    				this.exit.create(x + 16, x + 16, 'exit').setOrigin(0.5, 0.5);;
		    			} else if (symbol === 'L') {
		    				this.lollipop.create(x, y, 'lollipop');  
		    			}  else if (symbol === '2') {
		    				let bb = this.bear.create(x, y, 'bear');
		    				bb.setVelocityX(100);
		    				bb.body.setSize(32, 32);
		    			}
		    		}
		    	});
		    	this.physics.add.collider(this.timoha, this.platforms);
                this.physics.add.overlap(this.timoha, this.hazard, this.hitHazard, null, this);
                this.physics.add.overlap(this.timoha, this.exit, this.levelComplete, null, this);
                this.physics.add.overlap(this.timoha, this.bear, this.hitHazard, null, this);
                this.physics.add.collider(this.timoha, this.lollipop); 
                this.physics.add.collider(this.timoha, this.bear);     
                this.physics.add.collider(this.bear, this.platforms);   
                this.physics.add.collider(this.bullets, this.platforms, this.bulletHitWall, null, this);
                this.physics.add.overlap(this.bear, this.bullets, this.hitMob, null, this);


                this.createButtons();
                this.keySpace = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                this.cursors = this.input.keyboard.createCursorKeys();
                this.cameras.main.startFollow(this.timoha, true, 0.1, 0.1);
                this.cameras.main.setBounds(0, 0, 90 * this.tileSize, 20 * this.tileSize);
                this.physics.world.setBounds(0, 0, 90 * this.tileSize, 20 * this.tileSize);
		    }

		    createButtons() {
		    	const btnY = 550;
    
		    	this.leftPressed = false;
		    	this.rightPressed = false;
		    	this.jumpPressed = false;
    
		    	this.btnLeft = this.add.container(60, btnY);
    
		    	let bgL = this.add.image(0, 0, 'btnBg');
		    	let txtL = this.add.text(0, 0, '<', { fontSize: '40px', fill: '#000' }).setOrigin(0.5);
		    	this.btnLeft.add([bgL, txtL]);
    
		    	this.btnLeft.setSize(80, 80).setInteractive();
                this.btnLeft.setScrollFactor(0);
    
                this.btnLeft.on('pointerdown', () => {
                	this.leftPressed = true;
                	bgL.setScale(0.9);
                });
                this.btnLeft.on('pointerup', () => {
                	this.leftPressed = false;
                	bgL.setScale(1);
                });
                this.btnLeft.on('pointerout', () => {
                	this.leftPressed = false;
                	bgL.setScale(1);
                });
    
                this.btnRight = this.add.container(160, btnY);
    
                let bgR = this.add.image(0, 0, 'btnBg');
		    	let txtR = this.add.text(0, 0, '>', { fontSize: '40px', fill: '#000' }).setOrigin(0.5);
		    	this.btnRight.add([bgR, txtR]);
    
		    	this.btnRight.setSize(80, 80).setInteractive();
                this.btnRight.setScrollFactor(0);
    
                this.btnRight.on('pointerdown', () => {
                	this.rightPressed = true;
                	bgR.setScale(0.9);
                });
                this.btnRight.on('pointerup', () => {
                	this.rightPressed = false;
                	bgR.setScale(1);
                });
                this.btnRight.on('pointerout', () => {
                	this.rightPressed = false;
                	bgR.setScale(1);
                });

                this.btnShoot = this.add.container(660, btnY); 
                let bgS = this.add.image(0, 0, 'btnBg').setTint(0xffaa00); 
                let txtS = this.add.text(0, 0, 'S', { fontSize: '40px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5);
                this.btnShoot.add([bgS, txtS]);
                this.btnShoot.setSize(80, 80).setInteractive();
                this.btnShoot.setScrollFactor(0);
                this.btnShoot.on('pointerdown', () => {
                    this.shootPressed = true;
                    bgS.setScale(0.9);
                    this.fireBullet();
                });
                this.btnShoot.on('pointerup', () => {
                    this.shootPressed = false;
                    bgS.setScale(1);
                });
                this.btnShoot.on('pointerout', () => {
                    this.shootPressed = false;
                    bgS.setScale(1);
                });
    
                this.btnJump = this.add.container(740, btnY);
    
                let bgJ = this.add.image(0, 0, 'btnBg');
		    	let txtJ = this.add.text(0, 0, 'Up', { fontSize: '40px', fill: '#000' }).setOrigin(0.5);
		    	this.btnJump.add([bgJ, txtJ]);
    
		    	this.btnJump.setSize(80, 80).setInteractive();
                this.btnJump.setScrollFactor(0);
                
                this.btnJump.on('pointerdown', () => { 
                    this.jumpPressed = true; 
                    bgJ.setScale(0.9); 
                    this.doJump(); 
                });
                this.btnJump.on('pointerup', () => { this.jumpPressed = false; bgJ.setScale(1); });
		    }
		    doJump() {
		    	if (this.timoha.body.touching.down) {
		    		this.timoha.setVelocityY(-330);
		    	}
		    }
		    hitHazard() {
		    	this.scene.restart();
		    }
		    levelComplete() {
		    	
		    		this.add.text(200, 300, 'УРОВЕНЬ ПРОЙДЕН!', { fontSize: '40px', fill: '#0f0', fontStyle: 'bold'  }).setScrollFactor(0);
					this.physics.pause();
					this.time.delayedCall(2000, () => {
						this.scene.restart();
					});
		    	
		    }
		    moveMob() {
		    	this.bear.getChildren().forEach(mob => {
		    		if (mob.body.blocked.right) {
		    			mob.setVelocityX(-100);
		    		} else if (mob.body.blocked.left) {
		    			mob.setVelocityX(100);
		    		}
		    	});
		    }
		    fireBullet() {
		    	const time = this.time.now;
		    	if (time - this.lastFired < 300) return;
		    	this.lastFired = time;

		    	const bullet = this.bullets.get(this.timoha.x, this.timoha.y);
		    	if (bullet) {
		    		bullet.setActive(true).setVisible(true).body.enable = true;
		    		bullet.body.allowGravity = false;
		    		const dir = this.timoha.flipX ? -1 : 1;
		    		bullet.setVelocityX(600 * dir);
		    		bullet.x += (dir * 20);
		    	}
		    }
		    hitMob(bullet, mob) {
		    	bullet.destroy();
		    	mob.destroy();
		    	this.allMobs++;
		    }
		    bulletHitWall(bullet) {
		    	bullet.destroy();
		    }
		    update() {
		    	if (!this.timoha.active) return;

		    	const isLeft = this.cursors.left.isDown || this.leftPressed;
		    	const isRight = this.cursors.right.isDown || this.rightPressed;
		    	const isJump = this.cursors.up.isDown || this.jumpPressed;
		    	const isShoot = Phaser.Input.Keyboard.JustDown(this.keySpace) || this.shootPressed;

		    	if (isLeft) {
		    		this.timoha.setVelocityX(-100);
		    		this.timoha.flipX = false;
		    	} else if (isRight) {
		    		this.timoha.setVelocityX(100);
		    		this.timoha.flipX = true;
		    	} else {
		    		this.timoha.setVelocityX(0);
		    	}

		    	if (isJump && this.timoha.body.touching.down) {
		    		this.timoha.setVelocityY(-330);
		    	} 

		    	if (isShoot) {
		    		this.fireBullet();
		    	}

		    	if (this.timoha.y > this.physics.world.bounds.height) {
		    		this.scene.restart();
		    	}

		    	if (this.allMobs === 6) {
		    		this.levelComplete();
		    	}

		    	this.moveMob();
		    }
		}

		const config = {
			type: Phaser.AUTO,
			width: 800,
			height: 600,
			backgroundColor: '#fc89ac',
			physics: { default: 'arcade', arcade: { debug: false, gravity: { y: 600 } } },
			scene: Level6
		};

		const game = new Phaser.Game(config);
	</script>
</body>
</html>
